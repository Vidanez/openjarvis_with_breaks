name: Fork PR baseline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fork-pr-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-baseline:
    name: Python lint and focused tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.19"
          enable-cache: true

      - name: Install locked development and server dependencies
        run: uv sync --locked --extra dev --extra server --python 3.12

      - name: Build Rust extension
        run: uv run maturin develop --manifest-path rust/crates/openjarvis-python/Cargo.toml

      - name: Ruff check
        run: uv run ruff check src/ tests/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

      - name: Run focused hermetic Python tests
        run: >-
          uv run pytest tests/core tests/security tests/deploy -q --tb=short
          -m "not live and not cloud and not hub and not live_channel and not live_external and not docker and not modal"
